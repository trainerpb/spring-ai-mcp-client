spring.application.name=simple-mcp-client
server.port=8040

# Spring AI OpenAI Configuration
spring.ai.mistralai.api-key=${MISTRALAI_API_KEY}
# Optional: Specify the model (default is mistral-small-latest)
spring.ai.mistralai.chat.options.model=${MISTRALAI_MODEL_NAME:mistral-small-latest}

spring.ai.mcp.client.request-timeout=5m
spring.ai.mcp.transport.protocol=STREAMABLE
spring.ai.mcp.client.streamable-http.connections.loan-bot-mcp-server.url=http://localhost:8080/mcp

spring.ai.mcp.client.capabilities.elicitation={}
logging.level.io.modelcontextprotocol.client=INFO
logging.level.io.modelcontextprotocol.spec=INFO
logging.level.org.springframework.ai.mcp=TRACE
logging.level.org.springframework.ai.mcp.client=TRACE